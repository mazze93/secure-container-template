name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: local/secure-container-template:ci

jobs:
  test_and_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Enforce non-root USER in Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE="Dockerfile"
          test -f "$DOCKERFILE"

          if ! grep -Eq '^[[:space:]]*USER[[:space:]]+' "$DOCKERFILE"; then
            echo "::error::Dockerfile must include a USER instruction (non-root)."
            exit 1
          fi

          if grep -Eqi '^[[:space:]]*USER[[:space:]]+(root|0|0:0)[[:space:]]*$' "$DOCKERFILE"; then
            echo "::error::Dockerfile USER must not be root/0/0:0."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
        with:
          driver: docker-container

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine publish eligibility
        id: pub
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH="false"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            PUBLISH="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
              PUBLISH="true"
            fi
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Build and load (validation image)
        id: build_load
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hadolint policy check
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Hadolint SARIF report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i hadolint/hadolint -f sarif - < Dockerfile > hadolint.sarif

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818 # v3.32.6
        with:
          sarif_file: hadolint.sarif

      - name: Verify built image runs as non-root
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.LOCAL_IMAGE }}"

          USER_FIELD="$(docker image inspect "$IMAGE" --format '{{ .Config.User }}')"
          echo "Image: $IMAGE"
          echo "Image Config.User: '${USER_FIELD}'"

          if [[ -z "$USER_FIELD" ]]; then
            echo "::error::Image has empty Config.User (defaults to root)."
            exit 1
          fi
          if [[ "$USER_FIELD" =~ ^(root|0|0:0)$ ]]; then
            echo "::error::Image Config.User resolves to root."
            exit 1
          fi

      - name: Health test
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.LOCAL_IMAGE }}"
          docker run -d --name health-test -p 8000:8000 "$IMAGE"
          trap "docker rm -f health-test" EXIT
          sleep 2
          RESPONSE="$(curl -s -w '\n%{http_code}' http://localhost:8000/health)"
          HTTP_CODE="$(echo "$RESPONSE" | tail -n1)"
          BODY="$(echo "$RESPONSE" | head -n-1)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Health endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"status".*"ok"'; then
            echo "::error::Health endpoint missing 'status: ok' in response: $BODY"
            exit 1
          fi

      - name: Trivy policy check (fail on fixable critical/high)
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # 0.34.2
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          trivy-config: .trivy.yaml
          format: table
          exit-code: "1"

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # 0.34.2
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          trivy-config: .trivy.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818 # v3.32.6
        with:
          sarif_file: trivy.sarif

      - name: Log in to GHCR
        if: steps.pub.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SBOM + provenance)
        if: steps.pub.outputs.publish == 'true'
        id: build_push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.pub.outputs.publish == 'true'
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3

      - name: Cosign sign image (keyless)
        if: steps.pub.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"
          cosign sign --yes "$IMAGE_REF"

      - name: Cosign verify image signature
        if: steps.pub.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/.+$" \
            "$IMAGE_REF"
