name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: local/secure-container-template:validated
  VALIDATED_IMAGE_TAR: /tmp/validated-image.tar
  HADOLINT_IMAGE: hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Enforce non-root USER in Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE="Dockerfile"
          test -f "$DOCKERFILE"

          if ! grep -Eq '^[[:space:]]*USER[[:space:]]+' "$DOCKERFILE"; then
            echo "::error::Dockerfile must include a USER instruction (non-root)."
            exit 1
          fi

          if grep -Eqi '^[[:space:]]*USER[[:space:]]+(root|0|0:0)[[:space:]]*$' "$DOCKERFILE"; then
            echo "::error::Dockerfile USER must not be root/0/0:0."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
        with:
          driver: docker-container

      - name: Build validated image archive
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ env.VALIDATED_IMAGE_TAR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load validated image
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "${{ env.VALIDATED_IMAGE_TAR }}"

      - name: Hadolint policy check
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i "${{ env.HADOLINT_IMAGE }}" < Dockerfile

      - name: Hadolint SARIF report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint hadolint "${{ env.HADOLINT_IMAGE }}" -f sarif - < Dockerfile > hadolint.sarif || true
          if [[ ! -s hadolint.sarif ]]; then
            echo '{"version":"2.1.0","runs":[]}' > hadolint.sarif
          fi

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      - name: Build and push (SBOM + provenance)
        if: steps.pub.outputs.publish == 'true'
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load (no push)
        if: steps.pub.outputs.publish != 'true'
        id: build_load
        uses: docker/build-push-action@v7
        with:
          sarif_file: hadolint.sarif

      - name: Verify built image runs as non-root
        shell: bash
        run: |
          set -euo pipefail
          USER_FIELD="$(docker image inspect "${{ env.LOCAL_IMAGE }}" --format '{{ .Config.User }}')"

          if [[ -z "$USER_FIELD" ]]; then
            echo "::error::Image has empty Config.User (defaults to root)."
            exit 1
          fi

          if [[ "$USER_FIELD" =~ ^(root|0|0:0)$ ]]; then
            echo "::error::Image Config.User resolves to root."
            exit 1
          fi

      - name: Health test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name health-test -p 8000:8000 "${{ env.LOCAL_IMAGE }}"
          trap "docker rm -f health-test" EXIT
          sleep 2

          RESPONSE="$(curl -s -w '\n%{http_code}' http://localhost:8000/health)"
          HTTP_CODE="$(echo "$RESPONSE" | tail -n1)"
          BODY="$(echo "$RESPONSE" | head -n-1)"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Health endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"status".*"ok"'; then
            echo "::error::Health endpoint missing 'status: ok' in response: $BODY"
            exit 1
          fi

      - name: Trivy policy check
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # 0.34.2
        with:
          input: ${{ env.VALIDATED_IMAGE_TAR }}
          trivy-config: .trivy.yaml
          format: table
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # 0.34.2
        with:
          input: ${{ env.VALIDATED_IMAGE_TAR }}
          trivy-config: .trivy.yaml
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: trivy.sarif

      - name: Upload validated image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-image
          path: ${{ env.VALIDATED_IMAGE_TAR }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download validated image archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-image
          path: /tmp

      - name: Load validated image
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "${{ env.VALIDATED_IMAGE_TAR }}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY_TAG=""

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "${{ env.LOCAL_IMAGE }}" "$tag"
            docker push "$tag"
            if [[ -z "$PRIMARY_TAG" ]]; then
              PRIMARY_TAG="$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          DIGEST="$(docker buildx imagetools inspect "$PRIMARY_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "primary_tag=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3

      - name: Cosign sign image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$IMAGE_REF"

      - name: Cosign verify image signature
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@(refs/heads/main|refs/tags/.+)$" \
            "$IMAGE_REF"
