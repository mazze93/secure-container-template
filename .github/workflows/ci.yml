name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SCOUT_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

jobs:
  test_and_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Enforce non-root USER in Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE="Dockerfile"
          test -f "$DOCKERFILE"

          if ! grep -Eq '^[[:space:]]*USER[[:space:]]+' "$DOCKERFILE"; then
            echo "::error::Dockerfile must include a USER instruction (non-root)."
            exit 1
          fi

          if grep -Eqi '^[[:space:]]*USER[[:space:]]+(root|0|0:0)[[:space:]]*$' "$DOCKERFILE"; then
            echo "::error::Dockerfile USER must not be root/0/0:0."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver: docker-container

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=secure-container-template
            org.opencontainers.image.description=Minimal, hardened Python container template (non-root, SBOM + provenance, Scout reporting).
            org.opencontainers.image.licenses=Apache-2.0

      - name: Determine publish eligibility
        id: pub
        shell: bash
        env:
          # Mapped to env because secrets cannot be referenced directly in `if:`.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only publish (push to GHCR) on pushes to the default branch.
          # Pull requests — including Dependabot's, which run with a read-only
          # token and no access to secrets — build and test without pushing.
          PUBLISH="false"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            PUBLISH="true"
          fi

          # Docker Scout needs Docker Hub auth. Treat it as optional reporting:
          # only run it when publishing and BOTH Docker Hub secrets are set.
          SCOUT="false"
          if [[ "$PUBLISH" == "true" && -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            SCOUT="true"
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "scout=$SCOUT" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.pub.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SBOM + provenance)
        if: steps.pub.outputs.publish == 'true'
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load (no push)
        if: steps.pub.outputs.publish != 'true'
        id: build_load
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: local/secure-container-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built image runs as non-root
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.pub.outputs.publish }}" == "true" ]]; then
            IMAGE="${{ env.SCOUT_IMAGE }}"
            docker pull "$IMAGE" >/dev/null
          else
            IMAGE="local/secure-container-template:ci"
          fi

          USER_FIELD="$(docker image inspect "$IMAGE" --format '{{ .Config.User }}')"
          echo "Image: $IMAGE"
          echo "Image Config.User: '${USER_FIELD}'"

          if [[ -z "$USER_FIELD" ]]; then
            echo "::error::Image has empty Config.User (defaults to root)."
            exit 1
          fi
          if [[ "$USER_FIELD" =~ ^(root|0|0:0)$ ]]; then
            echo "::error::Image Config.User resolves to root."
            exit 1
          fi

      # Docker Hub login + Scout run after the image is already pushed, and are
      # best-effort: a missing/invalid Docker Hub credential reports a warning
      # but never fails the publish job.
      - name: Log in to Docker Hub (for Scout)
        id: dockerhub_login
        if: steps.pub.outputs.scout == 'true'
        continue-on-error: true
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout quickview (report)
        if: steps.pub.outputs.scout == 'true' && steps.dockerhub_login.outcome == 'success'
        continue-on-error: true
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: quickview
          image: ${{ env.SCOUT_IMAGE }}
          summary: true

      - name: Docker Scout CVEs (report fixable critical/high, non-blocking)
        if: steps.pub.outputs.scout == 'true' && steps.dockerhub_login.outcome == 'success'
        continue-on-error: true
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: cves
          image: ${{ env.SCOUT_IMAGE }}
          only-severities: critical,high
          only-fixed: true
          # Report findings without failing the build. Flip to `true` to turn
          # fixable critical/high CVEs back into a hard merge gate.
          exit-code: false
          summary: true
